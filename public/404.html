<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>建德市城镇排水系统智慧平台</title>
    <script>
      // GitHub Pages SPA 路由回退
      // 将当前路径保存到 sessionStorage，然后重定向到 index.html
      var pathSegmentsToKeep = 1; // 保持 /jdpaishui/ 前缀
      var l = window.location;
      var redirectPath = l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash;
      sessionStorage.redirect = redirectPath;
      l.replace(redirectPath);
    </script>
  </head>
  <body></body>
</html>
